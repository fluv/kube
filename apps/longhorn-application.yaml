apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.12.*
      helm:
        valuesObject:
          preUpgradeChecker:
            jobEnabled: false
          csi:
            attacherReplicaCount: 1
            provisionerReplicaCount: 2  # minAvailable=1 PDB + 2 replicas = 1 disruption allowed
            resizerReplicaCount: 1
            snapshotterReplicaCount: 1
          longhornUI:
            replicas: 1
          persistence:
            defaultClassReplicaCount: 2
          metrics:
            serviceMonitor:
              enabled: true
          defaultSettings:
            storageOverProvisioningPercentage: 200
            # Pin CSI provisioner and other system components to control-plane nodes
            # (pi.home.arpa, saraneth). Hetzner burst nodes lack this label, so the
            # match acts as anti-affinity: system pods never land on ephemeral nodes,
            # preventing PDB deadlocks that block cluster-autoscaler scale-down.
            # nodeSelector can't express NotIn; this positive match achieves the same
            # result for all nodes that exist or will exist in this cluster.
            systemManagedComponentsNodeSelector: "node-role.kubernetes.io/control-plane:true"
          ingress:
            enabled: true
            tls: true
            ingressClassName: tailscale
            host: longhorn.gentoo-mine.ts.net
            annotations:
              tailscale.com/proxy-class: spread-across-nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
