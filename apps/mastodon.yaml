apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mastodon
  namespace: argocd
spec:
  destinations:
  - name: in-cluster
    namespace: mastodon
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # Needed to bootstrap the namespace
  - group: ''
    kind: Namespace
  sourceRepos:
  - https://github.com/mastodon/chart.git
  - https://mastodon.github.io/helm-charts/
  - https://fedihost.github.io/helm-charts
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mastodon
spec:
  destination:
    namespace: mastodon
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/mastodon/chart.git
    targetRevision: HEAD
    path: '.'
    helm:
      valuesObject:
        # The three Deployments carry a stale preferred nodeAffinity for
        # pi.home.arpa, left by the client-side apply of 2026-04-25. Argo's
        # desired state has no affinity, but a merge cannot drop a field that is
        # absent from its last-applied set, so a full sync, a rollout and server-
        # side apply all left it in place. This makes the apply a wholesale
        # overwrite, which drops it. Scoped to Deployments via deploymentAnnotations;
        # the same option on a Service would try to rewrite clusterIP. See #739.
        deploymentAnnotations:
          argocd.argoproj.io/sync-options: Replace=true
        priorityClassName: cluster-critical
        mastodon:
          local_domain: zuzakistan.com
          web_domain: mastodon.zuzakistan.com
          singleUserMode: true
          secrets:
            existingSecret: mastodon-secrets
          hooks:
            dbPrepare:
              enabled: false # required for Argo CD apparently https://github.com/mastodon/chart/blob/f0d07aac6069b90ca481d79be918ca24d190538d/values.yaml#L34
          persistence:
            assets:
              existingClaim: mastodon-assets
            system:
              existingClaim: mastodon-system
          s3:
            enabled: true
            existingSecret: mastodon-s3
            bucket: mastodon-zuzakistan-com
            endpoint: https://storage.googleapis.com
            hostname: mstdn-media.zuzakistan.com
          cron:
            removeMedia:
              enabled: false
          metrics:
            prometheus:
              enable: true
          web:
            affinity: {}
            resources:
              requests:
                memory: 400Mi
                cpu: 100m
              limits:
                memory: 800Mi
          sidekiq:
            affinity: {}
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                memory: 600Mi
          streaming:
            affinity: {}
        extraEnvVars:
          S3_FORCE_SINGLE_REQUEST: true
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-production"
          ingressClassName: nginx
          hosts:
            - host: mastodon.zuzakistan.com
              paths:
                - path: "/"
          tls:
            - secretName: mastodon-tls
              hosts:
                - mastodon.zuzakistan.com
        elasticsearch:
          enabled: false
        postgresql:
          enabled: false
          auth:
            existingSecret: mastodon-postgresql
          postgresqlHostname: saraneth
        redis:
          enabled: false
          hostname: saraneth
          auth:
            existingSecret: mastodon-redis
  project: mastodon
  # The three Deployments carry a stale preferred nodeAffinity for pi.home.arpa
  # that a client-side apply will not strip: the field is absent from Argo's
  # last-applied set, so the three-way merge treats it as another manager's and
  # leaves it. A full sync plus a rollout on 2026-09-18 left it untouched.
  # Server-side apply makes field ownership explicit and removes it. See #739.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
