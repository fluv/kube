apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mastodon
  namespace: argocd
spec:
  destinations:
  - name: in-cluster
    namespace: mastodon
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # Needed to bootstrap the namespace
  - group: ''
    kind: Namespace
  sourceRepos:
  - https://github.com/mastodon/chart.git
  - https://mastodon.github.io/helm-charts/
  - https://fedihost.github.io/helm-charts
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mastodon
spec:
  destination:
    namespace: mastodon
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/mastodon/chart.git
    # Pinned at the revision the cluster is running: chart 6.8.5, app v4.5.9.
    # HEAD currently renders chart 6.10.2 / app v4.7.2, and mastodon.hooks.dbPrepare
    # is disabled below, so a HEAD sync would upgrade the image without running the
    # schema migration. Bump deliberately, with the migration handled.
    targetRevision: 0d9e9e384ece0086e0d2eb16a009bacd7cccc389
    path: '.'
    helm:
      valuesObject:
        priorityClassName: cluster-critical
        mastodon:
          local_domain: zuzakistan.com
          web_domain: mastodon.zuzakistan.com
          singleUserMode: true
          secrets:
            existingSecret: mastodon-secrets
          hooks:
            dbPrepare:
              enabled: false # required for Argo CD apparently https://github.com/mastodon/chart/blob/f0d07aac6069b90ca481d79be918ca24d190538d/values.yaml#L34
          persistence:
            assets:
              existingClaim: mastodon-assets
            system:
              existingClaim: mastodon-system
          s3:
            enabled: true
            existingSecret: mastodon-s3
            bucket: mastodon-zuzakistan-com
            endpoint: https://storage.googleapis.com
            hostname: mstdn-media.zuzakistan.com
          cron:
            removeMedia:
              enabled: false
          metrics:
            prometheus:
              enable: true
          web:
            affinity: {}
            resources:
              requests:
                memory: 400Mi
                cpu: 100m
              limits:
                memory: 800Mi
          sidekiq:
            affinity: {}
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                memory: 600Mi
          streaming:
            affinity: {}
        extraEnvVars:
          S3_FORCE_SINGLE_REQUEST: true
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-production"
          ingressClassName: nginx
          hosts:
            - host: mastodon.zuzakistan.com
              paths:
                - path: "/"
          tls:
            - secretName: mastodon-tls
              hosts:
                - mastodon.zuzakistan.com
        elasticsearch:
          enabled: false
        postgresql:
          enabled: false
          auth:
            existingSecret: mastodon-postgresql
          postgresqlHostname: saraneth
        redis:
          enabled: false
          hostname: saraneth
          auth:
            existingSecret: mastodon-redis
  project: mastodon
