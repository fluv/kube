apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notebook
  namespace: claude-notebook
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # Basic auth at the ingress. The notebook-auth Secret (htpasswd) is
    # applied out-of-band — see README. Mirrors claude-vestibule, claude-grocy.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: notebook-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    # Streamable HTTP MCP wants chunked responses unbuffered and longer
    # read/write timeouts. Same pattern as claude-vestibule and claude-grocy.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  # Suspended Aug 2026: notebook serves Open WebUI MCP over tailscale
  # (tailscale-ingress.yaml); the public endpoint is unused. Revert class
  # to `nginx` to re-enable — but the TLS renewal is broken (cert expired
  # 2026-08-26, renewal stuck since 2026-08-11, see #814) and must be
  # fixed first.
  ingressClassName: disabled
  rules:
    - host: notebook.mcp.k3s.fluv.net
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: notebook
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: notebook
                port:
                  name: http
  tls:
    - hosts:
        - notebook.mcp.k3s.fluv.net
      secretName: notebook-k3s-fluv-net-tls
